<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    {{CUSTOM_CSS}}
  </style>
</head>
<body>
  <header style="background: #090d16; border-bottom: 1px solid #1e293b; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; color: #94a3b8; position: sticky; top: 0; z-index: 50;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 16px;" aria-hidden="true">🏛️</span>
      <span style="color: #f1f5f9; font-size: 14px; font-weight: 700;">Business Rates Calculation Engine API Reference</span>
    </div>
  </header>

  <!-- Scalar API Reference Configuration (type="application/json" avoids inline script execution under CSP) -->
  <script
    id="api-reference"
    type="application/json"
    data-url="{{SPEC_URL}}"
    data-configuration='{"theme":"{{THEME}}","layout":"{{LAYOUT}}","showSidebar":true,"searchHotKey":"k","withDefaultFonts":false}'>
  </script>

  <!-- Scalar Accessibility & Autofill DOM Guardian (Decoupled from vendor bundle updates) -->
  <script src="/assets/scalar-guardian.js?v={{ASSET_VERSION}}"></script>

  <!-- Local Self-Hosted Scalar Standalone Bundle (Zero External CDN) -->
  <script src="/assets/scalar.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
