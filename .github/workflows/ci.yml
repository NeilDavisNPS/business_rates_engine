name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_OPTIONS: "--disable-warning=DEP0040"

jobs:
  backend-and-licenses:
    name: Rust Backend & License Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Backend Integration Tests
        run: cargo test --verbose

      - name: Run Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check Rust Licenses & Vulnerabilities with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: licenses advisories

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run Dual-Ecosystem License Policy Guardrail
        run: node scripts/check-licenses.js

      - name: Build Third-Party License Attribution Notices
        run: node scripts/generate-licenses.js

      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        run: npx --yes --loglevel error @cyclonedx/cdxgen -o sbom.cdx.json
        env:
          npm_config_loglevel: error

      - name: Upload SBOM & License Attribution Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sbom-and-attribution
          path: |
            sbom.cdx.json
            THIRD_PARTY_LICENSES.md

  frontend:
    name: Frontend Build & Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Svelte Diagnostic Check
        working-directory: ./frontend
        run: npm run check

      - name: Run Production Bundle Build
        working-directory: ./frontend
        run: npm run build

