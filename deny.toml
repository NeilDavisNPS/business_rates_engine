# =============================================================================
# cargo-deny configuration for business_rates_engine
# Ensures that only permissive open-source licenses are included in dependencies
# and guards against copyleft (GPL/AGPL), vulnerabilities, and yanked crates.
# =============================================================================

[licenses]
unlicensed = "deny"
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
]

# r-efi is tri-licensed under MIT OR Apache-2.0 OR LGPL-2.1-or-later.
# Clarify that we select the permissive MIT/Apache-2.0 options.
[[licenses.clarify]]
name = "r-efi"
expression = "MIT OR Apache-2.0"
license-files = []

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"

[bans]
multiple-versions = "warn"
highlight = "all"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

